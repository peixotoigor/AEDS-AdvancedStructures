        <tr><td>Acumulado</td><td>${hs.T.real}</td><td>+${hs.phi}</td><td><b>${hs.T.amor}</b></td></tr>
      </table>
      <div class="pd-section-title">Contadores Estruturais</div>
      <table class="pd-table">
        <tr><th>Comparações</th><th>Links</th><th>Cortes</th><th>Cascata</th></tr>
        <tr><td style="text-align:right">${hs.M.cmp}</td><td>${hs.M.lnk}</td><td>${hs.M.cut}</td><td>${hs.M.cas}</td></tr>
      </table>
      ${rootsRows ? `
        <div class="pd-section-title">Lema de Fibonacci por Árvore (tamanho ≥ F<sub>k+2</sub>)</div>
        <table class="pd-table">
          <tr><th>Raiz</th><th>Grau k</th><th>Nós</th><th>Mínimo</th><th>OK</th></tr>
          ${rootsRows}
        </table>` : ''}
    `;
  } else {
    const L = hs.last;
    metricsHTML = `
      <div class="pd-section-title">Métricas — ${esc(hs.nm)}</div>
      <table class="pd-table">
        <tr><th>Escopo</th><th>Comparações</th><th>Trocas</th><th>Passos Reais</th></tr>
        <tr><td>${L ? esc(L.op) : 'Última op.'}</td><td colspan="2" style="text-align:center">custo da operação</td><td><b>${L ? L.real : '—'}</b></td></tr>
        <tr><td>Acumulado</td><td>${hs.M.cmp}</td><td>${hs.M.swp}</td><td><b>${hs.T.real}</b></td></tr>
      </table>
    `;
  }

  if (currentMode === 4) {
    const cmpRows = bundle.heapsSnap.map((s, idx) => {
      const extra = s.t === 'f' ? `lnk:${s.M.lnk} cut:${s.M.cut + s.M.cas}` : `swp:${s.M.swp}`;
      return `<tr style="${idx === focusedCompareIdx ? 'background:var(--active-bg);font-weight:700' : ''}">
        <td>${esc(s.nm.replace('Heap ', ''))}</td><td>${s.M.cmp}</td><td>${extra}</td><td>${s.t === 'f' ? `${s.T.amor} (Φ=${s.phi})` : s.T.real}</td>
      </tr>`;
    }).join('');
    metricsHTML = `
      <div class="pd-section-title">Comparativo Acumulado dos 4 Heaps</div>
      <table class="pd-table">
        <tr><th>Estrutura</th><th>Cmp</th><th>Mov./Links</th><th>Total</th></tr>
        ${cmpRows}
      </table>
    ` + metricsHTML;
  }

  $('#pd-metrics-box').innerHTML = metricsHTML;
}

function renderAll() {
  const bundle = getActiveStepBundle();
  $('#clrs-cap-badge').textContent = currentMode === 3 ? 'CLRS CAP. 19' : (currentMode < 3 ? 'CLRS CAP. 6' : 'CLRS CAP. 6 & 19');

  const focusIdx = getFocusedHeapIndex();
  const focusedSnap = bundle.heapsSnap[focusIdx] || bundle.heapsSnap[0];

  renderTopSummaryBar(bundle);
  renderAuxStrips(focusedSnap);
  renderNodesStrip(focusedSnap);

  if (currentMode < 4) {
    $('#single-mode-container').style.display = 'block';
    $('#compare-mode-container').style.display = 'none';

    const diag = buildHeapDiagramMarkup(focusedSnap, 0);
    lastUnscaledW = diag.width;
    lastUnscaledH = diag.height;

    const canvas = $('#tree-canvas');
    canvas.style.width = `${diag.width}px`;
    canvas.style.height = `${diag.height}px`;

    const svgEl = $('#tree-svg');
    svgEl.setAttribute('viewBox', `0 0 ${diag.width} ${diag.height}`);
    svgEl.setAttribute('width', diag.width);
    svgEl.setAttribute('height', diag.height);
    svgEl.innerHTML = diag.svgHTML;

    const nodesLayer = $('#tree-nodes-layer');
    nodesLayer.innerHTML = diag.nodesHTML;
    applyCanvasZoom(currentZoom);
  } else {
    $('#single-mode-container').style.display = 'none';
    const cmpContainer = $('#compare-mode-container');
    cmpContainer.style.display = 'block';

    let cardsHTML = '<div class="compare-grid">';
    bundle.heapsSnap.forEach((hs, idx) => {
      const diag = buildHeapDiagramMarkup(hs, idx);
      const metText = hs.t === 'f'
        ? `cmp:${hs.M.cmp} · lnk:${hs.M.lnk} · cut:${hs.M.cut + hs.M.cas} · Φ=${hs.phi} · amort:${hs.T.amor}`
        : `cmp:${hs.M.cmp} · swp:${hs.M.swp} · real:${hs.T.real}`;
      const stepNote = hs.step ? `${hs.step.tag}: ${hs.step.title}` : 'Pronto para operação.';

      cardsHTML += `
        <div class="compare-card ${idx === focusedCompareIdx ? 'focused-card' : ''}" data-card-idx="${idx}">
          <div class="compare-card-head" data-head-idx="${idx}">
            <h3>${esc(hs.nm)} <span style="color:var(--mu);font-weight:500">(n=${hs.n})</span></h3>
            <div class="compare-metrics-row">${esc(metText)}</div>
          </div>
          <div class="compare-canvas-scroll">
            <div style="position:relative;margin:0 auto">
              <div class="compare-inner-canvas" data-w="${diag.width}" data-h="${diag.height}" style="position:relative;width:${diag.width}px;height:${diag.height}px;transform-origin:top left">
                <svg viewBox="0 0 ${diag.width} ${diag.height}" width="${diag.width}" height="${diag.height}" style="position:absolute;top:0;left:0;pointer-events:none;overflow:visible">${diag.svgHTML}</svg>
                <div>${diag.nodesHTML}</div>
              </div>
            </div>
          </div>
          <div class="compare-step-note">${esc(stepNote)}</div>
        </div>
      `;
    });
    cardsHTML += '</div>';
    cmpContainer.innerHTML = cardsHTML;

    cmpContainer.querySelectorAll('[data-head-idx]').forEach(hd => {
      hd.onclick = () => {
        focusedCompareIdx = Number(hd.dataset.headIdx);
        renderAll();
      };
    });
    applyCanvasZoom(currentZoom);
  }

  // Clique em qualquer nó na árvore seleciona para Decrease-Key / Delete e abre o balão
  document.querySelectorAll('.heap-node').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const nid = Number(el.dataset.nodeId);
      const pIdx = Number(el.dataset.panelIdx || 0);
      if (currentMode === 4) focusedCompareIdx = pIdx;
      selectAndInspectNode(nid, pIdx);
    };
  });

  renderPseudocodeDrawer(bundle);
  updateStepControlsUI(bundle);
  requestAnimationFrame(positionFloatingBalloon);
}

function selectAndInspectNode(nodeId, panelIdx = 0) {
  selectedNodeId = nodeId;
  balloonHiddenManually = false;
  inspectedNodeOverride = { nodeId, panelIdx };

  const bundle = getActiveStepBundle();
  const hs = bundle.heapsSnap[panelIdx] || bundle.heapsSnap[0];
  const node = flattenAllNodesInSnap(hs).find(n => n.id === nodeId);

  if (node && typeof node.k === 'number' && isFinite(node.k)) {
    if ($('#sel-op').value === 'dec') {
      $('#inp-op-arg').value = String(node.k - 5);
    }
  }

  renderAll();
  if (node) {
    setBannerMessage(`Nó de chave ${fmtKey(node.k)} selecionado. Você pode usar Diminuir Chave (DECREASE-KEY) ou Remover Nó (DELETE).`);
  }
}

function positionFloatingBalloon() {
  const fb = $('#floating-balloon');
  if (!$('#chk-balloon').checked || balloonHiddenManually) {
    fb.classList.remove('visible');
    return;
  }

  const bundle = getActiveStepBundle();
  const pIdx = inspectedNodeOverride ? inspectedNodeOverride.panelIdx : getFocusedHeapIndex();
  const hs = bundle.heapsSnap[pIdx] || bundle.heapsSnap[0];

  if (inspectedNodeOverride) {
    const node = flattenAllNodesInSnap(hs).find(n => n.id === inspectedNodeOverride.nodeId);
    const targetEl = document.querySelector(`.heap-node[data-node-id="${inspectedNodeOverride.nodeId}"][data-panel-idx="${pIdx}"]`);
    if (!node || !targetEl) {
      fb.classList.remove('visible');
      return;
    }

    $('#fb-tag').textContent = 'NÓ SELECIONADO';
    $('#fb-path').textContent = hs.t === 'f'
      ? `${hs.nm} · ${node.isRoot ? 'Raiz' : 'Interno'}`
      : `${hs.nm} · A[${node.idx}]`;
    $('#fb-title').textContent = hs.t === 'f'
      ? `Chave ${fmtKey(node.k)} (grau ${node.deg}, marca = ${node.mk ? 'TRUE' : 'FALSE'})`
      : `Elemento A[${node.idx}] = ${fmtKey(node.k)} ${node.isMin ? '(Mínimo)' : ''}`;
    $('#fb-desc').textContent = hs.t === 'f'
      ? `Subárvore com ${node.subtreeSize} nó(s) (limite mínimo de Fibonacci F_${node.deg + 2} = ${fibNum(node.deg + 2)}). Nó pronto para DECREASE-KEY ou DELETE.`
      : `Subárvore com ${node.subtreeSize} nó(s). Nó selecionado para DECREASE-KEY ou DELETE.`;

    const fEl = $('#fb-formula');
    fEl.style.display = 'block';
    fEl.textContent = hs.t === 'f'
      ? `Φ(H) = t + 2m = ${hs.tRoots} + 2·${hs.marks} = ${hs.phi}`
      : `PAI(${node.idx}) = ${node.idx > 0 ? Math.floor((node.idx - 1) / hs.d) : 'NIL'}  │  FILHOS = [${hs.d * node.idx + 1}..${hs.d * node.idx + hs.d}]`;

    const dEl = $('#fb-delta');
    dEl.style.display = 'block';
    dEl.textContent = hs.t === 'f'
      ? `chave = ${fmtKey(node.k)}  |  grau = ${node.deg}  |  marca = ${node.mk ? 'TRUE' : 'FALSE'}`
      : `índice = ${node.idx}  |  chave = ${fmtKey(node.k)}`;

    fb.classList.add('visible');
    placeBalloonAroundElement(targetEl);
    return;
  }

  // Modo passo a passo ativo
  if (currentStepIdx < 0 || currentStepIdx >= flatSteps.length || !hs || !hs.step) {
    fb.classList.remove('visible');
    return;
  }

  const step = hs.step;
  const primaryId = (step.hl && step.hl.length) ? step.hl[0] : hs.minId;
  if (primaryId === null || primaryId === undefined) {
    fb.classList.remove('visible');
    return;
  }

  const targetEl = document.querySelector(`.heap-node[data-node-id="${primaryId}"][data-panel-idx="${pIdx}"]`);
  if (!targetEl) {
    fb.classList.remove('visible');
    return;
  }

  $('#fb-tag').textContent = `${step.tag} · ${currentStepIdx + 1}/${flatSteps.length}`;
  $('#fb-path').textContent = hs.nm;
  $('#fb-title').textContent = step.title;
  $('#fb-desc').textContent = step.text;

  const fEl = $('#fb-formula');
  if (step.formula) {
    fEl.style.display = 'block';
    fEl.textContent = step.formula;
  } else {
    fEl.style.display = 'none';
  }

  const dEl = $('#fb-delta');
  const costSummary = hs.t === 'f'
    ? `Passo: real=${hs.stepReal}, ΔΦ=${fmtSigned(hs.stepDp)}, amort=${hs.stepAm}`
    : `Passo: custo real=${hs.stepReal}`;
  dEl.style.display = 'block';
  dEl.textContent = step.delta ? `${step.delta}  │  ${costSummary}` : costSummary;

  fb.classList.add('visible');
  placeBalloonAroundElement(targetEl);
}

function placeBalloonAroundElement(targetEl) {
  const fb = $('#floating-balloon');
  const rect = targetEl.getBoundingClientRect();
  const fbRect = fb.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const margin = 12;

  let pos = 'bottom';
  let top = rect.bottom + 10;
  if (top + fbRect.height > vh - margin && rect.top - fbRect.height - 10 > 84) {
    pos = 'top';
    top = rect.top - fbRect.height - 10;
  } else {
    top = Math.max(88, Math.min(top, vh - fbRect.height - margin));
  }

  const centerX = rect.left + rect.width / 2;
  let left = centerX - fbRect.width / 2;
  left = Math.max(margin, Math.min(left, vw - fbRect.width - margin));

  fb.dataset.pos = pos;
  fb.style.top = `${Math.round(top)}px`;
  fb.style.left = `${Math.round(left)}px`;

  const arrow = $('#balloon-arrow');
  const arrowLeft = Math.max(16, Math.min(centerX - left - 5, fbRect.width - 24));
  arrow.style.left = `${Math.round(arrowLeft)}px`;
}

function setBannerMessage(msg, isWarn = false, isHTML = false) {
  const b = $('#status-banner');
  b.classList.toggle('status-warn', isWarn);
  if (isHTML) b.innerHTML = msg;
  else b.textContent = msg;
}

function updateStepControlsUI(bundle) {
  const total = flatSteps.length;
  const hasActive = currentStepIdx >= 0 && currentStepIdx < total;

  const badge = $('#step-counter-badge');
  badge.textContent = total ? `Passo ${currentStepIdx + 1}/${total}` : 'Passo 0/0';
  badge.classList.toggle('active', hasActive);

  $('#btn-first').disabled = $('#btn-prev').disabled = (currentStepIdx <= 0);
  $('#btn-next').disabled = $('#btn-last').disabled = (currentStepIdx >= total - 1);
  $('#btn-play').textContent = playTimer ? '⏸' : '⏯ Auto';

  if (hasActive && !inspectedNodeOverride) {
    const hs = bundle.heapsSnap[getFocusedHeapIndex()] || bundle.heapsSnap[0];
    if (hs && hs.step) {
      setBannerMessage(`<b>${esc(bundle.opTitle)}:</b> ${esc(hs.step.title)}`, false, true);
    }
  }
}

function goToStep(idx) {
  if (!flatSteps.length) return;
  inspectedNodeOverride = null;
  currentStepIdx = Math.max(0, Math.min(idx, flatSteps.length - 1));
  renderAll();
  const activeEl = document.querySelector('.heap-node.node-active');
  if (activeEl) {
    activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
}

function startAutoPlayFrom(startIdx) {
  stopAutoPlay();
  balloonHiddenManually = false;
  inspectedNodeOverride = null;
  goToStep(startIdx);
  playTimer = setInterval(() => {
    if (currentStepIdx < flatSteps.length - 1) {
      goToStep(currentStepIdx + 1);
    } else {
      stopAutoPlay();
      updateStepControlsUI(getActiveStepBundle());
    }
  }, 720);
  updateStepControlsUI(getActiveStepBundle());
}

function stopAutoPlay() {
  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
  }
}

/* ==========================================================================
   7. CONTROLADORES DE OPERAÇÕES, ENTRADAS E PRESETS CANÔNICOS
   ========================================================================== */
function getRoomLeft() {
  const maxNodes = currentMode < 4 ? 32 : 18;
  const curMax = Math.max(...getActiveLiveHeaps().map(h => h.size()));
  return Math.max(0, maxNodes - curMax);
}

function insertSingleKey(k) {
  if (getRoomLeft() < 1) {
    setBannerMessage('Limite visual de nós atingido. Extraia ou reinicie o heap.', true);
    return;
  }
  const id = nextNodeId++;
  runAndRecordOperation(`INSERT(${k})`, 'ins', h => h.ins(id, k));
}

function parseIntList(str) {
  return String(str).split(/[\s,;]+/).map(s => parseInt(s, 10)).filter(n => !Number.isNaN(n));
}

function syncOperationArgUI() {
  const op = $('#sel-op').value;
  const wrap = $('#op-arg-wrap');
  const lbl = $('#lbl-op-arg');
  const inp = $('#inp-op-arg');

  if (op === 'ext' || op === 'min' || op === 'del') {
    wrap.style.display = 'none';
  } else if (op === 'dec') {
    wrap.style.display = 'inline-flex';
    lbl.textContent = 'nova k:';
    inp.style.width = '64px';
    const hs = getActiveStepBundle().heapsSnap[getFocusedHeapIndex()];
    const selN = hs ? flattenAllNodesInSnap(hs).find(n => n.id === selectedNodeId) : null;
    inp.value = selN && isFinite(selN.k) ? String(selN.k - 5) : '2';
  } else if (op === 'list' || op === 'uni') {
    wrap.style.display = 'inline-flex';
    lbl.textContent = 'chaves:';
    inp.style.width = '126px';
    inp.value = op === 'list' ? '18 5 29 11' : '9 25 4 31';
  } else if (op === 'rand') {
    wrap.style.display = 'inline-flex';
    lbl.textContent = 'qtd:';
    inp.style.width = '54px';
    inp.value = '6';
  }
}

function executeSelectedOperation() {
  const op = $('#sel-op').value;
  if (op === 'ext') {
    runAndRecordOperation('EXTRACT-MIN()', 'ext', h => h.ext());
  } else if (op === 'min') {
    runAndRecordOperation('MINIMUM()', 'min', h => h.mn());
  } else if (op === 'dec') {
    if (selectedNodeId === null) {
      setBannerMessage('Clique primeiro em um nó na árvore (ou na barra "Nós no Heap") para escolhê-lo.', true);
      return;
    }
    const newK = parseInt($('#inp-op-arg').value, 10);
    if (Number.isNaN(newK)) {
      setBannerMessage('Digite um inteiro válido para a nova chave.', true);
      return;
    }
    const targetId = selectedNodeId;
    runAndRecordOperation(`DECREASE-KEY(${newK})`, 'dec', h => h.byId[targetId] ? h.dec(targetId, newK) : null);
  } else if (op === 'del') {
    if (selectedNodeId === null) {
      setBannerMessage('Clique primeiro em um nó na árvore (ou na barra "Nós no Heap") para removê-lo.', true);
      return;
    }
    const targetId = selectedNodeId;
    selectedNodeId = null;
    runAndRecordOperation('DELETE()', 'del', h => h.byId[targetId] ? h.del(targetId) : null);
  } else if (op === 'list' || op === 'rand') {
    let keys = op === 'list'
      ? parseIntList($('#inp-op-arg').value)
      : Array.from({ length: Math.max(1, parseInt($('#inp-op-arg').value, 10) || 5) }, () => 1 + Math.floor(Math.random() * 95));
    keys = keys.slice(0, getRoomLeft());
    if (!keys.length) {
      setBannerMessage('Lista vazia ou limite de nós atingido.', true);
      return;
    }
    keys.forEach(k => {
      const id = nextNodeId++;
      runAndRecordOperation(`INSERT(${k})`, 'ins', h => h.ins(id, k), true);
    });
    balloonHiddenManually = true;
    renderAll();
    if (currentMode < 4) requestAnimationFrame(fitTreeToViewport);
    setBannerMessage(`${keys.length} chave(s) inserida(s): {${keys.join(', ')}}.`);
  } else if (op === 'uni') {
    let keys = parseIntList($('#inp-op-arg').value).slice(0, getRoomLeft());
    if (!keys.length) {
      setBannerMessage('Informe ao menos uma chave para H2 (ou limite atingido).', true);
      return;
    }
    const ids = keys.map(() => nextNodeId++);
    runAndRecordOperation(`UNION({${keys.join(',')}})`, 'uni', h => {
      const B = new HeapModel(h.t, h.d, 'H2');
      keys.forEach((k, idx) => {
        const c0 = B.c, p0 = B.phi();
        for (const _ of B.ins(ids[idx], k));
        B.recordOpSummary('INSERT', c0, p0);
      });
      h.T.real += B.T.real;
      h.T.amor += B.T.amor;
      h._unionPhiExtra = B.phi();
      return h.uni(B);
    });
  }
}

function resetActiveHeaps() {
  stopAutoPlay();
  getActiveLiveHeaps().forEach(h => h.reset());
  selectedNodeId = null;
  inspectedNodeOverride = null;
  flatSteps = [];
  currentStepIdx = -1;
  currentZoom = 1;
  $('#ps-select').value = 'make';
  renderAll();
  setBannerMessage('MAKE-HEAP executado: estrutura vazia inicializada.');
}

// Preset 1: Constrói árvores consolidadas de múltiplos graus (CLRS Cap. 19)
function loadPresetConsolidated() {
  stopAutoPlay();
  getActiveLiveHeaps().forEach(h => h.reset());
  selectedNodeId = null;
  inspectedNodeOverride = null;
  flatSteps = [];
  currentStepIdx = -1;
  currentZoom = 1;

  const baseKeys = [23, 7, 21, 3, 18, 52, 38, 39, 41, 17, 24, 26, 46];
  baseKeys.forEach(k => {
    const id = nextNodeId++;
    runAndRecordOperation(`INSERT(${k})`, 'ins', h => h.ins(id, k), true);
  });
  // Executa EXTRACT-MIN(3) gravando todos os passos de CONSOLIDATE(H)!
  flatSteps = [];
  runAndRecordOperation('EXTRACT-MIN()', 'ext', h => h.ext(), false);
  stopAutoPlay();
  currentStepIdx = flatSteps.length - 1;
  balloonHiddenManually = false;
  renderAll();
  requestAnimationFrame(fitTreeToViewport);
  setBannerMessage('Preset Consolidado carregado! Use ◀ e ▶ para rever cada passo de CONSOLIDATE(H) e FIB-HEAP-LINK.');
}

// Preset 2: Prepara pai marcado e dispara CASCADING-CUT passo a passo
function loadPresetCascadingCut() {
  stopAutoPlay();
  getActiveLiveHeaps().forEach(h => h.reset());
  selectedNodeId = null;
  inspectedNodeOverride = null;
  flatSteps = [];
  currentStepIdx = -1;
  currentZoom = 1;

  const setupKeys = [1, 10, 20, 30, 40, 50, 60, 70, 80];
  const assignedIds = {};
  setupKeys.forEach(k => {
    const id = nextNodeId++;
    assignedIds[k] = id;
    runAndRecordOperation(`INSERT(${k})`, 'ins', h => h.ins(id, k), true);
  });
  // Extrai 1 para consolidar os 8 nós restantes numa única árvore binomial B_3 de raiz 10!
  // Em B_3 (raiz 10): filhos da raiz 10 são 20 (grau 0), 30 (grau 1, filho 40) e 50 (grau 2, filhos 60 e 70->80).
  runAndRecordOperation('EXTRACT-MIN()', 'ext', h => h.ext(), true);
  // 1º corte: corta 80 (filho de 70) -> marca 70; corta 60 (filho de 50) -> marca 50!
  runAndRecordOperation('DECREASE-KEY(5)', 'dec', h => h.dec(assignedIds[60], 5), true);

  // Agora 50 está MARCADO (marca = TRUE) e ainda tem o filho 70!
  // Reduzimos 70 -> 4 gravando todos os passos para demonstrar CUT + CASCADING-CUT em 50!
  flatSteps = [];
  selectedNodeId = assignedIds[70];
  runAndRecordOperation('DECREASE-KEY(70 → 4)', 'dec', h => h.dec(assignedIds[70], 4), false);
  requestAnimationFrame(fitTreeToViewport);
}

$('#btn-zoom-out').onclick = () => applyCanvasZoom(currentZoom - 0.12);
$('#btn-zoom-reset').onclick = () => applyCanvasZoom(1);
$('#btn-zoom-fit').onclick = fitTreeToViewport;

$('#btn-first').onclick = () => { stopAutoPlay(); balloonHiddenManually = false; goToStep(0); };
$('#btn-prev').onclick = () => { stopAutoPlay(); balloonHiddenManually = false; goToStep(currentStepIdx - 1); };
$('#btn-next').onclick = () => { stopAutoPlay(); balloonHiddenManually = false; goToStep(currentStepIdx + 1); };
$('#btn-last').onclick = () => { stopAutoPlay(); balloonHiddenManually = false; goToStep(flatSteps.length - 1); };

$('#btn-play').onclick = () => {
  if (playTimer) {
    stopAutoPlay();
    updateStepControlsUI(getActiveStepBundle());
  } else if (flatSteps.length) {
    const start = currentStepIdx >= flatSteps.length - 1 ? 0 : Math.max(0, currentStepIdx);
    startAutoPlayFrom(start);
  }
};

function togglePseudoDrawer(forceState) {
  const open = typeof forceState === 'boolean'
    ? (document.body.classList.toggle('pseudo-open', forceState), forceState)
    : document.body.classList.toggle('pseudo-open');
  $('#btn-pseudo').classList.toggle('btn-toggle-on', open);
  requestAnimationFrame(() => {
    fitTreeToViewport();
    positionFloatingBalloon();
  });
}

$('#btn-pseudo').onclick = () => togglePseudoDrawer();
$('#btn-close-pseudo').onclick = () => togglePseudoDrawer(false);
$('#ps-select').onchange = () => renderPseudocodeDrawer(getActiveStepBundle());

$('#fb-close').onclick = () => {
  balloonHiddenManually = true;
  inspectedNodeOverride = null;
  positionFloatingBalloon();
};

$('#chk-balloon').onchange = () => {
  balloonHiddenManually = false;
  positionFloatingBalloon();
};

window.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    stopAutoPlay();
    balloonHiddenManually = false;
    goToStep(currentStepIdx + 1);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    stopAutoPlay();
    balloonHiddenManually = false;
    goToStep(currentStepIdx - 1);
  } else if (e.key === 'Escape') {
    balloonHiddenManually = true;
    inspectedNodeOverride = null;
    positionFloatingBalloon();
  }
});

window.addEventListener('resize', () => requestAnimationFrame(positionFloatingBalloon), { passive: true });
window.addEventListener('scroll', () => requestAnimationFrame(positionFloatingBalloon), { passive: true });
$('#tree-viewport').addEventListener('scroll', () => requestAnimationFrame(positionFloatingBalloon), { passive: true });

// Inicializa exibindo o Heap de Fibonacci consolidado canônico (CLRS Cap. 19)
syncOperationArgUI();
loadPresetConsolidated();
</script>
</body>
</html>
