<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulador de Heaps — Fibonacci &amp; d-ários — CLRS Canônico (Cap. 6 e 19)</title>
<style>
:root {
  --bg: #FFFFFF;
  --bar-bg: #FAFAFA;
  --surface: #F8FAFC;
  --surface-2: #F1F5F9;
  --ink: #111827;
  --ink-2: #374151;
  --mu: #6B7280;
  --nil: #9CA3AF;
  --bd: #D1D5DB;
  --bd-light: #E5E7EB;
  --active-bg: #FFFBEB;
  --active-head: #FEF3C7;
  --active-ring: rgba(245, 158, 11, 0.28);
  --active-accent: #D97706;
  --sel-bg: #EFF6FF;
  --sel-bd: #2563EB;
  --sel-ring: rgba(37, 99, 235, 0.22);
  --mark-bg: #1F2937;
  --mark-ink: #F9FAFB;
  --err-bg: #FEF2F2;
  --err-bd: #EF4444;
  --err-ink: #991B1B;
  --shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.05);
  --shadow-md: 0 4px 12px rgba(17, 24, 39, 0.08);
  --shadow-balloon: 0 14px 32px rgba(17, 24, 39, 0.16), 0 2px 6px rgba(17, 24, 39, 0.08);
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.4 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ==========================================================================
   1. CABEÇALHO ÚNICO ENXUTO (#top-header) — PADRÃO VISUAL UNIFICADO
   ========================================================================== */
#top-header {
  background: var(--bar-bg);
  border-bottom: 1px solid var(--bd);
  padding: 10px 18px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: var(--shadow-sm);
}

.header-main-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
}

.brand-group {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.brand-group h1 {
  margin: 0;
  font: 700 15.5px/1.2 var(--sans);
  color: var(--ink);
  letter-spacing: -0.3px;
}

.clrs-badge {
  font: 700 10px var(--mono);
  background: var(--ink);
  color: #FFFFFF;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.3px;
}

.toolbar-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}

.ctrl-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg);
  padding: 3px 8px;
  border: 1px solid var(--bd);
  border-radius: 6px;
}

.ctrl-pill label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-2);
  white-space: nowrap;
}

input[type="number"], input[type="text"], select {
  width: 62px;
  padding: 4px 6px;
  border: 1px solid var(--bd);
  border-radius: 4px;
  background: var(--bg);
  color: var(--ink);
  font: 600 12px var(--mono);
}

input[type="text"] {
  width: 118px;
}

select {
  width: auto;
  font-family: var(--sans);
  cursor: pointer;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--ink);
}

button {
  border: 1px solid var(--bd);
  border-radius: 5px;
  padding: 4px 9px;
  font: 600 11.5px var(--sans);
  color: var(--ink);
  background: var(--bg);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, transform 0.06s;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

button:hover:not(:disabled) {
  background: var(--surface-2);
  border-color: var(--ink-2);
}

button:active:not(:disabled) {
  transform: translateY(1px);
}

button:disabled {
  opacity: 0.38;
  cursor: default;
}

button.btn-dark {
  background: var(--ink);
  color: #FFFFFF;
  border-color: var(--ink);
}

button.btn-dark:hover:not(:disabled) {
  background: var(--ink-2);
  border-color: var(--ink-2);
}

button.btn-toggle-on {
  background: var(--active-head);
  border-color: var(--active-accent);
  color: #92400E;
}

.sel-node-pill {
  font: 700 11px var(--mono);
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--surface);
  color: var(--mu);
  border: 1px dashed var(--bd);
  white-space: nowrap;
}

.sel-node-pill.has-sel {
  background: var(--sel-bg);
  color: #1D4ED8;
  border: 1px solid var(--sel-bd);
}

.step-compact-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--bg);
  padding: 3px 7px;
  border: 1px solid var(--bd);
  border-radius: 6px;
}

.step-compact-group button {
  padding: 3px 7px;
  font-size: 11px;
}

.step-badge {
  font: 700 11px var(--mono);
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--surface);
  color: var(--ink);
  min-width: 78px;
  text-align: center;
}

.step-badge.active {
  background: var(--active-head);
  color: #92400E;
}

.chk-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  margin-left: 4px;
}

input[type="checkbox"] {
  accent-color: var(--ink);
  cursor: pointer;
}

/* Linha 2 do Cabeçalho: Régua de Seleção / Inserção Rápida + Status */
.header-ruler-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 14px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--bd-light);
}

.ruler-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1;
  min-width: 260px;
}

.ruler-lbl {
  font: 700 11px var(--sans);
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.univ-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
}

.u-cell {
  min-width: 28px;
  height: 25px;
  padding: 0 6px;
  border: 1px solid var(--bd);
  border-radius: 4px;
  background: var(--bg);
  color: var(--ink-2);
  font: 700 11.5px var(--mono);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  user-select: none;
  transition: all 0.1s;
}

.u-cell:hover {
  border-color: var(--ink);
  color: var(--ink);
  background: var(--surface);
}

.u-cell.present {
  background: var(--ink);
  color: #FFFFFF;
  border-color: var(--ink);
}

.u-cell.is-min-chip {
  border-width: 2px;
}

.u-cell.is-marked-chip {
  background: #374151;
}

.u-cell.selected-chip {
  background: #1D4ED8;
  border-color: #1D4ED8;
  color: #FFFFFF;
  box-shadow: 0 0 0 3px var(--sel-ring);
}

.u-cell.queried {
  box-shadow: 0 0 0 3px var(--active-ring);
  border-color: var(--active-accent);
}

.u-cell.quick-add {
  background: var(--surface);
  color: var(--mu);
  border-style: dashed;
  font-family: var(--sans);
  font-size: 11px;
}

.u-cell.quick-add:hover {
  color: var(--ink);
  border-style: solid;
}

#status-banner {
  font-size: 12px;
  color: var(--ink-2);
  background: var(--bg);
  border: 1px solid var(--bd-light);
  border-radius: 5px;
  padding: 4px 10px;
  max-width: 100%;
}

#status-banner.status-warn {
  background: var(--err-bg);
  border-color: var(--err-bd);
  color: var(--err-ink);
}

/* ==========================================================================
   2. ÁREA PRINCIPAL (#main-workspace) + GAVETA DISCRETA DE PSEUDOCÓDIGO
   ========================================================================== */
#main-workspace {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
  padding: 12px 16px 20px;
  background: var(--bg);
  align-items: start;
}

body.pseudo-open #main-workspace {
  grid-template-columns: minmax(0, 1fr) 390px;
}

@media (max-width: 1060px) {
  body.pseudo-open #main-workspace {
    grid-template-columns: minmax(0, 1fr);
  }
}

#tree-viewport {
  width: 100%;
  min-height: calc(100vh - 140px);
  overflow: auto;
  background: var(--bg);
  border: 1px solid var(--bd-light);
  border-radius: 8px;
  padding: 54px 20px 36px;
  position: relative;
}

/* Barra superior flutuante discreta dentro do canvas */
.canvas-overlay-bar {
  position: sticky;
  top: 0;
  left: 0;
  right: 0;
  margin-top: -42px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  pointer-events: none;
  z-index: 20;
}

.canvas-info-pill {
  pointer-events: auto;
  background: rgba(248, 250, 252, 0.94);
  backdrop-filter: blur(4px);
  border: 1px solid var(--bd-light);
  border-radius: 5px;
  padding: 4px 10px;
  font: 600 11.5px var(--mono);
  color: var(--ink-2);
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
  align-items: center;
}

.phi-pill-highlight {
  background: var(--active-head);
  color: #92400E;
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 700;
}

.canvas-zoom-controls {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(4px);
  border: 1px solid var(--bd);
  border-radius: 6px;
  padding: 3px 6px;
  box-shadow: var(--shadow-sm);
}

.canvas-zoom-controls button {
  padding: 2px 7px;
  font-size: 11px;
}

.zoom-lbl {
  font: 700 11px var(--mono);
  min-width: 38px;
  text-align: center;
  color: var(--ink);
}

/* Faixas auxiliares no topo do canvas (Arranjo A[0..D] na consolidação ou Arranjo d-ário) */
#aux-strips-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.aux-strip-box {
  background: var(--surface);
  border: 1px solid var(--bd-light);
  border-radius: 6px;
  padding: 7px 12px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.aux-strip-title {
  font: 700 11px var(--mono);
  color: var(--ink-2);
  text-transform: uppercase;
}

.aux-cells {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.aux-cell {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  min-width: 38px;
  border: 1px solid var(--bd);
  border-radius: 4px;
  background: var(--bg);
  padding: 2px 5px;
}

.aux-cell.aux-active {
  background: var(--active-bg);
  border-color: var(--active-accent);
  box-shadow: 0 0 0 2px var(--active-ring);
}

.aux-cell .aux-idx {
  font: 600 9px var(--mono);
  color: var(--mu);
}

.aux-cell .aux-val {
  font: 700 11.5px var(--mono);
  color: var(--ink);
}

.aux-cell.aux-nil .aux-val {
  color: var(--nil);
  font-weight: 500;
}

#tree-scale-wrapper {
  margin: 0 auto;
  position: relative;
}

#tree-canvas {
  position: relative;
  transform-origin: top left;
  transition: transform 0.14s ease;
}

#tree-svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  overflow: visible;
}

.svg-edge {
  fill: none;
  stroke: #94A3B8;
  stroke-width: 1.7px;
  transition: stroke 0.18s, stroke-width 0.18s;
}

.svg-edge.edge-rootlist {
  stroke-dasharray: 5 4;
  stroke: #94A3B8;
  stroke-width: 1.5px;
}

.svg-edge.edge-active {
  stroke: var(--ink);
  stroke-width: 2.8px;
  stroke-dasharray: none;
}

.group-banner-svg {
  font: 700 12px var(--mono);
  fill: var(--ink-2);
}

.empty-heap-placeholder {
  padding: 64px 20px;
  text-align: center;
  color: var(--mu);
  font: 500 13.5px var(--sans);
}

/* ==========================================================================
   3. ANATOMIA CANÔNICA DOS NÓS (FIBONACCI CAP. 19 & HEAP D-ÁRIO CAP. 6)
   ========================================================================== */
.heap-node {
  position: absolute;
  z-index: 2;
  background: var(--bg);
  border: 1.5px solid var(--ink-2);
  border-radius: 5px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  user-select: none;
  transition: transform 0.12s, box-shadow 0.15s, border-color 0.15s, background 0.15s;
}

.heap-node:hover {
  border-color: var(--ink);
  box-shadow: var(--shadow-md);
}

.heap-node.node-is-min {
  border: 2px solid var(--ink);
}

.heap-node.node-marked {
  border-color: var(--ink);
  background: #F8FAFC;
}

.heap-node.node-ancestor {
  border-color: var(--active-accent);
}

.heap-node.node-selected {
  border: 2px solid var(--sel-bd);
  box-shadow: 0 0 0 3px var(--sel-ring), var(--shadow-sm);
}

.heap-node.node-active {
  border: 2px solid var(--ink);
  background: var(--active-bg);
  box-shadow: 0 0 0 4px var(--active-ring), var(--shadow-md);
  z-index: 10;
}

.node-role-tag {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font: 600 9.5px/1 var(--sans);
  color: var(--mu);
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.95);
  padding: 2px 5px;
  border-radius: 3px;
}

.heap-node.node-is-min .node-role-tag {
  background: var(--ink);
  color: #FFFFFF;
  font-weight: 700;
}

.heap-node.node-active .node-role-tag {
  background: var(--active-accent);
  color: #FFFFFF;
  font-weight: 700;
}

.node-top-row {
  display: grid;
  height: 100%;
}

.heap-node.fib-node .node-top-row {
  grid-template-columns: 1.25fr 0.85fr 1fr;
}

.heap-node.dary-node .node-top-row {
  grid-template-columns: 0.9fr 1.2fr;
}

.node-attr-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3px 4px;
  border-right: 1px solid var(--bd-light);
}

.node-attr-cell:last-child {
  border-right: none;
}

.attr-lbl {
  font: 600 8px/1 var(--sans);
  text-transform: uppercase;
  color: var(--mu);
  margin-bottom: 2px;
}

.attr-val {
  font: 700 12px/1.1 var(--mono);
  color: var(--ink);
}

.attr-val.val-key {
  background: var(--surface-2);
  padding: 1px 5px;
  border-radius: 3px;
}

.heap-node.node-is-min .attr-val.val-key {
  background: var(--ink);
  color: #FFFFFF;
}

.heap-node.node-active .attr-val.val-key {
  background: var(--active-head);
  color: var(--ink);
}

.attr-val.val-mark-true {
  background: var(--mark-bg);
  color: var(--mark-ink);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 9.5px;
}

.attr-val.val-mark-false {
  color: var(--nil);
  font-size: 9.5px;
  font-weight: 600;
}

/* ==========================================================================
   4. MODO COMPARAR OS 4 (GRADE 2x2 NO MESMO PADRÃO CANÔNICO)
   ========================================================================== */
.compare-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

@media (max-width: 980px) {
  .compare-grid {
    grid-template-columns: 1fr;
  }
}

.compare-card {
  border: 1px solid var(--bd);
  border-radius: 7px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.compare-card.focused-card {
  border-color: var(--ink);
  box-shadow: var(--shadow-md);
}

.compare-card-head {
  background: var(--bar-bg);
  border-bottom: 1px solid var(--bd-light);
  padding: 7px 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  cursor: pointer;
}

.compare-card-head h3 {
  margin: 0;
  font: 700 13px var(--sans);
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.compare-metrics-row {
  font: 600 10.5px var(--mono);
  color: var(--ink-2);
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.compare-canvas-scroll {
  overflow: auto;
  padding: 24px 12px 16px;
  min-height: 220px;
  position: relative;
}

.compare-step-note {
  border-top: 1px solid var(--bd-light);
  background: var(--surface);
  padding: 5px 10px;
  font: 500 11px var(--sans);
  color: var(--ink-2);
  min-height: 27px;
}

/* ==========================================================================
   5. GAVETA LATERAL DE PSEUDOCÓDIGO CLRS & ANÁLISE AMORTIZADA (#pseudo-drawer)
   ========================================================================== */
#pseudo-drawer {
  display: none;
  position: sticky;
  top: 86px;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 12px 14px;
  box-shadow: var(--shadow-md);
  max-height: calc(100vh - 104px);
  overflow: auto;
}

body.pseudo-open #pseudo-drawer {
  display: block;
}

.pd-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-bottom: 8px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--bd-light);
}

.pd-header h2 {
  margin: 0;
  font: 700 13px var(--sans);
  color: var(--ink);
}

#ps-select {
  width: 100%;
  margin-bottom: 8px;
  font: 600 12px var(--sans);
}

#ps-code {
  background: var(--surface);
  border: 1px solid var(--bd-light);
  border-radius: 6px;
  padding: 8px 6px;
  font: 500 11.2px/1.55 var(--mono);
  color: var(--ink-2);
  overflow-x: auto;
}

.ps-ln {
  display: block;
  white-space: pre;
  padding: 1px 6px;
  border-left: 3px solid transparent;
  border-radius: 3px;
}

.ps-ln.on {
  background: var(--active-head);
  border-left-color: var(--active-accent);
  color: var(--ink);
  font-weight: 700;
}

.pd-step-explain {
  margin: 8px 0 10px;
  padding: 6px 9px;
  background: var(--active-bg);
  border-left: 3px solid var(--active-accent);
  border-radius: 0 4px 4px 0;
  font: 600 11.5px/1.4 var(--sans);
  color: var(--ink);
}

.pd-section-title {
  font: 700 11px var(--sans);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: var(--mu);
  margin: 10px 0 5px;
}

.pd-table {
  width: 100%;
  border-collapse: collapse;
  font: 500 11.2px var(--mono);
  margin-bottom: 8px;
}

.pd-table th, .pd-table td {
  border-bottom: 1px solid var(--bd-light);
  padding: 4px 5px;
  text-align: right;
}

.pd-table th:first-child, .pd-table td:first-child {
  text-align: left;
  font-family: var(--sans);
}

.pd-table th {
  color: var(--mu);
  font-weight: 600;
  font-size: 10.5px;
}

/* ==========================================================================
   6. BALÃO FLUTUANTE COMPACTO (#floating-balloon) — IDÊNTICO À REFERÊNCIA
   ========================================================================== */
#floating-balloon {
  position: fixed;
  z-index: 1000;
  width: min(365px, calc(100vw - 24px));
  background: #FFFFFF;
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 8px;
  padding: 10px 12px;
  box-shadow: var(--shadow-balloon);
  display: none;
  opacity: 0;
  transition: top 0.16s cubic-bezier(0.22, 1, 0.36, 1), left 0.16s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.12s ease;
}

#floating-balloon.visible {
  display: block;
  opacity: 1;
}

#balloon-arrow {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #FFFFFF;
  transform: rotate(45deg);
  pointer-events: none;
}

#floating-balloon[data-pos="bottom"] #balloon-arrow {
  top: -7px;
  border-left: 2px solid var(--ink);
  border-top: 2px solid var(--ink);
}

<body>

  <!-- Gaveta Discreta de Pseudocódigo CLRS e Custos Amortizados -->

<!-- 3. BALÃO FLUTUANTE COMPACTO (#floating-balloon) -->
<div id="floating-balloon" data-pos="bottom" role="dialog" aria-live="polite">
  <div id="balloon-arrow"></div>
  <div class="fb-top">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span class="fb-tag" id="fb-tag">OPERAÇÃO</span>
      <span class="fb-node-path" id="fb-path">Raiz</span>
    </div>
    <button class="fb-close" id="fb-close" title="Fechar (Esc)">✕</button>
  </div>
  <div class="fb-title" id="fb-title"></div>
  <div class="fb-desc" id="fb-desc"></div>
  <div class="fb-formula" id="fb-formula" style="display:none"></div>
  <div class="fb-delta" id="fb-delta" style="display:none"></div>
</div>

<script>
/* ==========================================================================
   1. UTILITÁRIOS E MATEMÁTICA CANÔNICA CLRS (CAPÍTULOS 6 E 19)
   ========================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const PHI = (1 + Math.sqrt(5)) / 2;
const fmtKey = k => (k === -Infinity ? '−∞' : String(k));
const fmtSigned = v => (v > 0 ? `+${v}` : String(v));

function fibNum(idx) {
  let a = 0, b = 1;
  while (idx-- > 0) [a, b] = [b, a + b];
  return a;
}

function maxDegreeBound(n) {
  return n > 0 ? Math.floor(Math.log(n) / Math.log(PHI) + 1e-9) : 0;
}

/* ==========================================================================
   2. PSEUDOCÓDIGOS CANÔNICOS CLRS (FIBONACCI CAP. 19 & HEAP D-ÁRIO CAP. 6)
   ========================================================================== */
const PSEUDO = {
  f: {
    make: `a|MAKE-FIB-HEAP()
b|  aloque H
c|  H.n ← 0; H.min ← NIL
d|  retorne H`,
    ins: `a|FIB-HEAP-INSERT(H, x)
b|  x.grau ← 0; x.p ← NIL; x.filho ← NIL; x.marca ← FALSE
c|  se H.min = NIL
d|    crie lista de raízes de H contendo x; H.min ← x
e|  senão insira x na lista circular de raízes de H
f|    se x.chave < H.min.chave então H.min ← x
g|  H.n ← H.n + 1`,
    min: `a|FIB-HEAP-MINIMUM(H)
b|  retorne H.min`,
    uni: `a|FIB-HEAP-UNION(H1, H2)
b|  H ← MAKE-FIB-HEAP()
c|  H.min ← H1.min
d|  concatene a lista de raízes de H2 com a de H
e|  se H1.min = NIL ou (H2.min ≠ NIL e H2.min.chave < H1.min.chave)
f|    H.min ← H2.min
g|  H.n ← H1.n + H2.n
h|  retorne H`,
    ext: `a|FIB-HEAP-EXTRACT-MIN(H)
b|  z ← H.min
c|  se z ≠ NIL
d|    para cada filho x de z
e|      adicione x à lista de raízes de H; x.p ← NIL; x.marca ← FALSE
f|    remova z da lista de raízes de H
g|    se z = z.direita então H.min ← NIL
h|    senão H.min ← z.direita; CONSOLIDATE(H)
i|    H.n ← H.n − 1
j|  retorne z
k|CONSOLIDATE(H)
l|  crie arranjo A[0..D(H.n)] com A[i] ← NIL
m|  para cada raiz w na lista de raízes de H
n|    x ← w; d ← x.grau
o|    enquanto A[d] ≠ NIL
p|      y ← A[d]
q|      se x.chave > y.chave então troque x ↔ y
r|      FIB-HEAP-LINK(H, y, x)
s|      A[d] ← NIL; d ← d + 1
t|    A[d] ← x
u|  H.min ← NIL
v|  para i ← 0 até D(H.n)
w|    se A[i] ≠ NIL
x|      insira A[i] na lista de raízes e atualize H.min`,
    dec: `a|FIB-HEAP-DECREASE-KEY(H, x, k)
b|  se k > x.chave então erro "nova chave maior que a atual"
c|  x.chave ← k; y ← x.p
d|  se y ≠ NIL e x.chave < y.chave
e|    CUT(H, x, y)
f|    CASCADING-CUT(H, y)
g|  se x.chave < H.min.chave então H.min ← x
h|CUT(H, x, y)
i|  remova x de y.filhos; y.grau ← y.grau − 1
j|  adicione x à lista de raízes; x.p ← NIL; x.marca ← FALSE
k|CASCADING-CUT(H, y)
l|  z ← y.p
m|  se z ≠ NIL
n|    se y.marca = FALSE então y.marca ← TRUE
o|    senão CUT(H, y, z); CASCADING-CUT(H, z)`,
    del: `a|FIB-HEAP-DELETE(H, x)
b|  FIB-HEAP-DECREASE-KEY(H, x, −∞)
c|  FIB-HEAP-EXTRACT-MIN(H)`
  },
  d: {
    make: `a|MAKE-DARY-HEAP()
b|  A ← arranjo vazio; A.tamanho ← 0
c|  retorne A`,
    ins: `a|DARY-INSERT(A, k)
b|  A.tamanho ← A.tamanho + 1
c|  A[A.tamanho − 1] ← k
d|  SIFT-UP(A, A.tamanho − 1)
e|SIFT-UP(A, i)      // PAI(i) = ⌊(i − 1)/d⌋
f|  enquanto i > 0 e A[PAI(i)].chave > A[i].chave
g|    troque A[i] ↔ A[PAI(i)]; i ← PAI(i)`,
    min: `a|DARY-MINIMUM(A)
b|  retorne A[0]`,
    ext: `a|DARY-EXTRACT-MIN(A)
b|  se A.tamanho < 1 então erro "heap vazio"
c|  min ← A[0]
d|  A[0] ← A[A.tamanho − 1]; A.tamanho ← A.tamanho − 1
e|  SIFT-DOWN(A, 0)
f|  retorne min
g|SIFT-DOWN(A, i)
h|  repita
i|    m ← índice do menor entre A[i] e filhos (d·i+1 .. d·i+d)
j|    se m = i então pare
k|    troque A[i] ↔ A[m]; i ← m`,
    dec: `a|DARY-DECREASE-KEY(A, i, k)
b|  se k > A[i].chave então erro "nova chave maior"
c|  A[i].chave ← k
d|  SIFT-UP(A, i)
e|SIFT-UP(A, i)
f|  enquanto i > 0 e A[PAI(i)].chave > A[i].chave
g|    troque A[i] ↔ A[PAI(i)]; i ← PAI(i)`,
    del: `a|DARY-DELETE(A, i)
b|  DARY-DECREASE-KEY(A, i, −∞)
c|  DARY-EXTRACT-MIN(A)`,
    uni: `a|DARY-UNION(A1, A2)
b|  A ← A1 concatenado com A2
c|  para i ← ⌊(n − 2)/d⌋ até 0    // BUILD-HEAP Θ(n)
d|    SIFT-DOWN(A, i)
e|SIFT-DOWN(A, i)
f|  repita
g|    m ← menor entre A[i] e seus d filhos
h|    se m = i então pare
i|    troque A[i] ↔ A[m]; i ← m`
  }
};

/* ==========================================================================
   3. ESTRUTURA DE DADOS DOS HEAPS COM GERADORES PASSO A PASSO E SNAPSHOTS
   ========================================================================== */
const YStep = (p, l, tag, title, text, hl = [], extra = {}) => ({
  p, l, tag, title, text, hl,
  formula: extra.formula || null,
  delta: extra.delta || null,
  consSlot: extra.consSlot !== undefined ? extra.consSlot : null
});

class HeapModel {
  constructor(type, d, name) {
    this.t = type; // 'f' ou 'd'
    this.d = d;
    this.nm = name;
    this.reset();
  }

  reset() {
    this.a = [];
    this.roots = [];
    this.min = null;
    this.n = 0;
    this.c = 0;
    this.M = { cmp: 0, swp: 0, lnk: 0, cut: 0, cas: 0 };
    this.T = { real: 0, amor: 0 };
    this.last = null;
    this.aux = null;
    this.consA = null;
    this.consMaxD = 0;
    this.byId = {};
  }

  size() {
    return this.t === 'f' ? this.n : this.a.length;
  }

  marks() {
    if (this.t !== 'f') return 0;
    return Object.values(this.byId).filter(x => x.mk).length;
  }

  phi() {
    return this.t === 'f' ? this.roots.length + 2 * this.marks() : 0;
  }

  phiFormulaStr() {
    if (this.t !== 'f') return null;
    const t = this.roots.length, m = this.marks();
    return `Φ(H) = t(H) + 2·m(H) = ${t} + 2·${m} = ${t + 2 * m}  │  D(n) = ⌊log_φ(${this.n})⌋ = ${maxDegreeBound(this.n)}`;
  }

  daryFormulaStr(idx) {
    if (this.t !== 'd' || idx === null || idx === undefined || idx < 0) return null;
    const p = idx > 0 ? Math.floor((idx - 1) / this.d) : 'NIL';
    const c1 = this.d * idx + 1, c2 = this.d * idx + this.d;
    return `d = ${this.d}  │  PAI(${idx}) = ${p}  │  FILHOS(${idx}) = [${c1}..${c2}]`;
  }

  recordOpSummary(op, c0, p0) {
    const real = this.c - c0;
    const dp = this.phi() - p0;
    const am = real + dp;
    this.last = { op, real, dp, am };
    this.T.real += real;
    this.T.amor += am;
  }

  snapshot(stepInfo = null, c0 = this.c, p0 = this.phi()) {
    const stepReal = this.c - c0;
    const stepDp = this.phi() - p0;
    const stepAm = stepReal + stepDp;

    const serializeFibNode = (x, isRoot = false) => {
      const kids = x.ch.map(c => serializeFibNode(c, false));
      const subSize = 1 + kids.reduce((acc, k) => acc + k.subtreeSize, 0);
      return {
        id: x.id,
        k: x.k,
        deg: x.deg,
        mk: x.mk,
        parentId: x.p ? x.p.id : null,
        isRoot,
        isMin: x === this.min,
        subtreeSize: subSize,
        kids
      };
    };

    const serializeDaryNode = idx => {
      if (idx >= this.a.length) return null;
      const kids = [];
      for (let j = 1; j <= this.d; j++) {
        const chIdx = this.d * idx + j;
        if (chIdx < this.a.length) kids.push(serializeDaryNode(chIdx));
      }
      const parentIdx = idx > 0 ? Math.floor((idx - 1) / this.d) : null;
      return {
        id: this.a[idx].id,
        k: this.a[idx].k,
        idx,
        parentId: parentIdx !== null ? this.a[parentIdx].id : null,
        isRoot: idx === 0,
        isMin: idx === 0,
        subtreeSize: 1 + kids.reduce((acc, k) => acc + k.subtreeSize, 0),
        kids
      };
    };

    return {
      t: this.t,
      d: this.d,
      nm: this.nm,
      n: this.size(),
      phi: this.phi(),
      tRoots: this.t === 'f' ? this.roots.length : (this.a.length ? 1 : 0),
      marks: this.marks(),
      M: { ...this.M },
      T: { ...this.T },
      last: this.last ? { ...this.last } : null,
      stepReal,
      stepDp,
      stepAm,
      minKey: this.t === 'f' ? (this.min ? this.min.k : null) : (this.a.length ? this.a[0].k : null),
      minId: this.t === 'f' ? (this.min ? this.min.id : null) : (this.a.length ? this.a[0].id : null),
      trees: this.t === 'f' ? this.roots.map(r => serializeFibNode(r, true)) : (this.a.length ? [serializeDaryNode(0)] : []),
      auxTrees: this.aux
        ? (this.t === 'f'
            ? this.aux.roots.map(r => {
                const rec = (x, ir) => {
                  const ks = x.ch.map(c => rec(c, false));
                  return { id: x.id, k: x.k, deg: x.deg, mk: x.mk, parentId: x.p ? x.p.id : null, isRoot: ir, isMin: x === this.aux.min, subtreeSize: 1 + ks.reduce((s, c) => s + c.subtreeSize, 0), kids: ks };
                };
                return rec(r, true);
              })
            : (this.aux.a.length ? [(() => {
                const rec = idx => {
                  const ks = [];
                  for (let j = 1; j <= this.aux.d; j++) {
                    const ci = this.aux.d * idx + j;
                    if (ci < this.aux.a.length) ks.push(rec(ci));
                  }
                  const pi = idx > 0 ? Math.floor((idx - 1) / this.aux.d) : null;
                  return { id: this.aux.a[idx].id, k: this.aux.a[idx].k, idx, parentId: pi !== null ? this.aux.a[pi].id : null, isRoot: idx === 0, isMin: idx === 0, subtreeSize: 1 + ks.reduce((s, c) => s + c.subtreeSize, 0), kids: ks };
                };
                return rec(0);
              })()] : []))
        : null,
      daryArr: this.t === 'd' ? this.a.map((x, idx) => ({ id: x.id, k: x.k, idx })) : null,
      consA: this.consA ? this.consA.map((x, deg) => (x ? { deg, id: x.id, k: x.k } : { deg, id: null, k: null })) : null,
      step: stepInfo
    };
  }

  /* ---- OPERAÇÕES COMUNS ---- */
  *del(id) {
    if (!this.byId[id]) {
      yield YStep('del', 'b', 'DELETE — AUSENTE', 'Nó não encontrado neste heap', 'O identificador selecionado não pertence ao conjunto atual.');
      return;
    }
    const curK = this.byId[id].k;
    yield YStep('del', 'b', 'DELETE — REDUÇÃO A −∞', `Reduz chave de ${fmtKey(curK)} para −∞ via DECREASE-KEY`, 'No modelo CLRS, remover um nó reduz sua chave a −∞ para levá-lo ao topo e em seguida executa EXTRACT-MIN.', [id]);
    yield* this.dec(id, -Infinity);
    yield* this.ext();
  }

  /* ---- HEAP D-ÁRIO (CAP. 6 GENERALIZADO) ---- */
  *siftUp(i, proc, tags) {
    const a = this.a, d = this.d;
    while (i > 0) {
      const q = Math.floor((i - 1) / d);
      this.M.cmp++;
      this.c++;
      yield YStep(proc, tags[0], 'SIFT-UP — COMPARAÇÃO',
        `Compara filho A[${i}] = ${fmtKey(a[i].k)} com pai A[${q}] = ${fmtKey(a[q].k)}`,
        a[q].k <= a[i].k
          ? `A propriedade de heap mínimo já vale (${fmtKey(a[q].k)} ≤ ${fmtKey(a[i].k)}). SIFT-UP encerra.`
          : `O filho (${fmtKey(a[i].k)}) é menor que o pai (${fmtKey(a[q].k)}); realiza troca.`,
        [a[i].id, a[q].id],
        { formula: this.daryFormulaStr(i), delta: `Comparação #${this.M.cmp}: A[${i}] vs A[${q}]` }
      );
      if (a[q].k <= a[i].k) break;
      [a[i], a[q]] = [a[q], a[i]];
      this.M.swp++;
      this.c++;
      yield YStep(proc, tags[1], 'SIFT-UP — TROCA',
        `Troca realizada: ${fmtKey(a[q].k)} sobe para A[${q}]`,
        `A chave ${fmtKey(a[q].k)} assume o índice ${q} e o antigo pai desce para A[${i}].`,
        [a[q].id, a[i].id],
        { formula: this.daryFormulaStr(q), delta: `A[${q}] ← ${fmtKey(a[q].k)}  |  A[${i}] ← ${fmtKey(a[i].k)}` }
      );
      i = q;
    }
  }

  *siftDown(i, proc, tags) {
    const a = this.a, d = this.d;
    for (;;) {
      let m = i;
      const hi = Math.min(a.length - 1, d * i + d);
      for (let j = d * i + 1; j <= hi; j++) {
        this.M.cmp++;
        this.c++;
        if (a[j].k < a[m].k) m = j;
      }
      yield YStep(proc, tags[1], 'SIFT-DOWN — VARREDURA DOS d FILHOS',
        `Menor entre A[${i}] e seus até ${d} filhos: A[${m}] = ${fmtKey(a[m].k)}`,
        m === i
          ? `Nenhum filho é menor que A[${i}] = ${fmtKey(a[i].k)}. Propriedade de heap restaurada.`
          : `Entre os filhos inspecionados, A[${m}] = ${fmtKey(a[m].k)} é o menor e subirá para A[${i}].`,
        m === i ? [a[i].id] : [a[i].id, a[m].id],
        { formula: this.daryFormulaStr(i), delta: `Menor índice no grupo: m = ${m}` }
      );
      if (m === i) break;
      [a[i], a[m]] = [a[m], a[i]];
      this.M.swp++;
      this.c++;
      yield YStep(proc, tags[3], 'SIFT-DOWN — TROCA',
        `Troca A[${i}] ↔ A[${m}]: ${fmtKey(a[m].k)} desce para o índice ${m}`,
        `Continua a descida a partir de A[${m}] para preservar a ordem em toda a subárvore.`,
        [a[m].id, a[i].id],
        { formula: this.daryFormulaStr(m), delta: `A[${i}] ← ${fmtKey(a[i].k)}  |  A[${m}] ← ${fmtKey(a[m].k)}` }
      );
      i = m;
    }
  }

  *dins(id, k) {
    const x = { id, k };
    this.a.push(x);
    this.byId[id] = x;
    this.c++;
    const idx = this.a.length - 1;
    yield YStep('ins', 'c', 'DARY-INSERT',
      `Aloca ${fmtKey(k)} no final do arranjo: A[${idx}]`,
      `No heap ${this.d}-ário implícito em vetor, a inserção anexa o elemento na folha A[${idx}] antes de subir com SIFT-UP.`,
      [id],
      { formula: this.daryFormulaStr(idx), delta: `A[${idx}] ← ${fmtKey(k)}  |  n = ${this.a.length}` }
    );
    yield* this.siftUp(idx, 'ins', ['f', 'g']);
  }

  *dmn() {
    this.c++;
    if (!this.a.length) {
      yield YStep('min', 'b', 'MINIMUM — VAZIO', 'O arranjo está vazio (retorna NIL)', 'Não há elementos armazenados em A.');
      return;
    }
    yield YStep('min', 'b', 'MINIMUM — O(1)',
      `Retorna imediatamente a raiz A[0] = ${fmtKey(this.a[0].k)}`,
      `Em qualquer heap ${this.d}-ário mínimo, o menor elemento está sempre fixo em A[0].`,
      [this.a[0].id],
      { formula: this.daryFormulaStr(0), delta: `min(A) = A[0] = ${fmtKey(this.a[0].k)}` }
    );
  }

  *dext() {
    const a = this.a;
    if (!a.length) {
      yield YStep('ext', 'b', 'EXTRACT-MIN — VAZIO', 'Heap vazio: nada a extrair', 'A operação retorna NIL imediatamente.');
      return;
    }
    const z = a[0];
    yield YStep('ext', 'c', 'EXTRACT-MIN — CAPTURA A[0]',
      `Identifica o mínimo na raiz: A[0] = ${fmtKey(z.k)}`,
      `Guarda o valor mínimo ${fmtKey(z.k)} para retorno e prepara a substituição pela última folha.`,
      [z.id],
      { formula: this.daryFormulaStr(0), delta: `min capturado = ${fmtKey(z.k)}` }
    );
    const last = a.pop();
    this.c++;
    delete this.byId[z.id];
    if (a.length) {
      a[0] = last;
      yield YStep('ext', 'd', 'EXTRACT-MIN — MOVE ÚLTIMA FOLHA',
        `Move ${fmtKey(last.k)} para a raiz A[0] (n = ${a.length})`,
        `A última folha assume temporariamente A[0]; SIFT-DOWN irá restaurar a propriedade de heap em O(d log_d n).`,
        [last.id],
        { formula: this.daryFormulaStr(0), delta: `A[0] ← ${fmtKey(last.k)}  |  n = ${a.length}` }
      );
      yield* this.siftDown(0, 'ext', ['h', 'i', 'j', 'k']);
    } else {
      yield YStep('ext', 'f', 'EXTRACT-MIN — ESVAZIOU',
        `Último elemento (${fmtKey(z.k)}) removido; heap agora vazio`,
        `Não restaram elementos no vetor A.`,
        [],
        { delta: `n = 0  |  retorno = ${fmtKey(z.k)}` }
      );
    }
  }

  *ddec(id, k) {
    const a = this.a, i = a.findIndex(x => x.id === id);
    if (i < 0) {
      yield YStep('dec', 'b', 'DECREASE-KEY — AUSENTE', 'Nó inexistente neste heap', 'O nó selecionado não pertence ao vetor.');
      return;
    }
    if (k > a[i].k) {
      yield YStep('dec', 'b', 'ERRO CLRS', `Nova chave (${fmtKey(k)}) é maior que a atual (${fmtKey(a[i].k)})`, 'DECREASE-KEY exige k ≤ chave atual.', [id]);
      return;
    }
    const oldK = a[i].k;
    a[i].k = k;
    this.c++;
    yield YStep('dec', 'c', 'DECREASE-KEY — ATUALIZA CHAVE',
      `A[${i}].chave reduzida: ${fmtKey(oldK)} → ${fmtKey(k)}`,
      `Em um heap ${this.d}-ário, diminuir a chave pode violar a ordem apenas em relação aos ancestrais (SIFT-UP em O(log_d n)).`,
      [id],
      { formula: this.daryFormulaStr(i), delta: `A[${i}]: ${fmtKey(oldK)} → ${fmtKey(k)}` }
    );
    yield* this.siftUp(i, 'dec', ['f', 'g']);
  }

  *duni(B) {
    this.aux = B;
    yield YStep('uni', 'a', 'DARY-UNION — ENTRADA',
      `Dois heaps ${this.d}-ários independentes: H1 (n=${this.a.length}) e H2 (n=${B.a.length})`,
      `Heaps em vetor não suportam união em O(1): é preciso concatenar os vetores e executar BUILD-HEAP em Θ(n).`,
      this.a.length ? [this.a[0].id] : []
    );
    this.aux = null;
    this.a = this.a.concat(B.a);
    Object.assign(this.byId, B.byId);
    this.c += B.a.length;
    yield YStep('uni', 'b', 'DARY-UNION — CONCATENAÇÃO',
      `Vetores concatenados (n = ${this.a.length}); inicia BUILD-HEAP`,
      `Percorre os nós internos de trás para frente aplicando SIFT-DOWN.`,
      this.a.length ? [this.a[0].id] : []
    );
    for (let i = Math.floor((this.a.length - 2) / this.d); i >= 0; i--) {
      yield* this.siftDown(i, 'uni', ['f', 'g', 'h', 'i']);
    }
  }

  /* ---- HEAP DE FIBONACCI CANÔNICO (CLRS CAP. 19) ---- */
  *fins(id, k) {
    const pBefore = this.phi();
    const x = { id, k, deg: 0, mk: false, p: null, ch: [] };
    this.byId[id] = x;
    this.c++;
    this.roots.push(x);
    this.n++;
    const wasEmpty = !this.min;
    if (!this.min) {
      this.min = x;
    }
    yield YStep('ins', wasEmpty ? 'd' : 'e', 'FIB-HEAP-INSERT O(1)',
      `Insere nó ${fmtKey(k)} (grau 0, marca FALSE) na lista circular de raízes`,
      `Nenhuma consolidação é feita agora (estratégia preguiçosa). t(H) aumenta em 1, elevando Φ(H) em +1 para pré-pagar futura consolidação.`,
      [id],
      { formula: this.phiFormulaStr(), delta: `Φ: ${pBefore} → ${this.phi()} (ΔΦ = +1)  |  H.n = ${this.n}` }
    );
    if (!wasEmpty) {
      this.M.cmp++;
      this.c++;
      if (k < this.min.k) {
        const oldMin = this.min.k;
        this.min = x;
        yield YStep('ins', 'f', 'ATUALIZA H.min',
          `${fmtKey(k)} < antigo H.min (${fmtKey(oldMin)}) → H.min aponta para ${fmtKey(k)}`,
          `Atualiza o ponteiro para o menor elemento da lista de raízes em O(1).`,
          [id],
          { formula: this.phiFormulaStr(), delta: `H.min: ${fmtKey(oldMin)} → ${fmtKey(k)}` }
        );
      }
    }
  }

  *fmn() {
    this.c++;
    if (!this.min) {
      yield YStep('min', 'b', 'FIB-HEAP-MINIMUM — VAZIO', 'H.min = NIL (heap vazio)', 'Não há árvores na lista de raízes.');
      return;
    }
    yield YStep('min', 'b', 'FIB-HEAP-MINIMUM O(1)',
      `Retorna diretamente o ponteiro H.min = ${fmtKey(this.min.k)}`,
      `Como H.min aponta sempre para a raiz de menor chave, a consulta tem custo real e amortizado Θ(1), com ΔΦ = 0.`,
      [this.min.id],
      { formula: this.phiFormulaStr(), delta: `H.min = ${fmtKey(this.min.k)}  |  ΔΦ = 0` }
    );
  }

  *funi(B) {
    const pBefore = this.phi() + B.phi();
    this.aux = B;
    yield YStep('uni', 'b', 'FIB-HEAP-UNION — ENTRADA',
      `Prepara união em O(1) de H1 (n=${this.n}, Φ=${this.phi()}) e H2 (n=${B.n}, Φ=${B.phi()})`,
      `Diferente dos heaps em vetor, o Heap de Fibonacci apenas emenda duas listas circulares duplamente encadeadas.`,
      this.min ? [this.min.id] : [],
      { formula: `Φ(H1) + Φ(H2) = ${this.phi()} + ${B.phi()} = ${pBefore}` }
    );
    this.aux = null;
    this.roots = this.roots.concat(B.roots);
    Object.assign(this.byId, B.byId);
    this.n += B.n;
    this.c++;
    if (B.min) {
      this.M.cmp++;
      this.c++;
      if (!this.min || B.min.k < this.min.k) this.min = B.min;
    }
    yield YStep('uni', 'f', 'FIB-HEAP-UNION O(1)',
      `Listas de raízes concatenadas; H.min = ${this.min ? fmtKey(this.min.k) : 'NIL'}`,
      `Nenhum link é executado agora. ΔΦ = Φ(H) − (Φ(H1) + Φ(H2)) = 0, resultando em custo amortizado O(1).`,
      this.min ? [this.min.id] : [],
      { formula: this.phiFormulaStr(), delta: `ΔΦ = 0  |  t(H) = ${this.roots.length}  |  H.n = ${this.n}` }
    );
  }

  *fext() {
    const z = this.min;
    if (!z) {
      yield YStep('ext', 'b', 'EXTRACT-MIN — VAZIO', 'H.min = NIL: heap vazio', 'Nenhuma operação necessária.');
      return;
    }
    const pStart = this.phi();
    yield YStep('ext', 'b', 'EXTRACT-MIN — SELECIONA H.min',
      `z ← H.min = ${fmtKey(z.k)} (grau ${z.deg})`,
      `A raiz mínima z será removida; seus ${z.deg} filho(s) serão promovidos para a lista circular de raízes.`,
      [z.id],
      { formula: this.phiFormulaStr(), delta: `z = ${fmtKey(z.k)}  |  Φ inicial = ${pStart}` }
    );

    const zKids = z.ch.slice();
    this.roots = this.roots.filter(r => r !== z);
    for (const x of zKids) {
      x.p = null;
      x.mk = false;
      this.roots.push(x);
      this.c++;
    }
    delete this.byId[z.id];
    this.n--;

    if (zKids.length > 0) {
      yield YStep('ext', 'e', 'PROMOÇÃO DOS FILHOS DE z',
        `${zKids.length} filho(s) de ${fmtKey(z.k)} entram na lista de raízes (marca ← FALSE)`,
        `Cada filho promovido perde o vínculo com z e vira raiz independente antes de CONSOLIDATE(H).`,
        zKids.map(x => x.id),
        { formula: this.phiFormulaStr(), delta: `t(H) = ${this.roots.length} raízes  |  H.n = ${this.n}` }
      );
    }

    if (!this.roots.length) {
      this.min = null;
      yield YStep('ext', 'g', 'LISTA DE RAÍZES VAZIA',
        `Único nó (${fmtKey(z.k)}) extraído → H.min ← NIL`,
        `O heap ficou vazio (n = 0, Φ = 0).`,
        [],
        { formula: this.phiFormulaStr(), delta: `H.min = NIL  |  Φ: ${pStart} → 0` }
      );
    } else {
      this.min = this.roots[0];
      yield* this.consolidate(pStart);
    }
  }

  *consolidate(pStart) {
    const D = Math.max(maxDegreeBound(this.n) + 1, ...this.roots.map(r => r.deg + 2));
    this.consA = Array(D + 1).fill(null);
    const rootSnapshotList = this.roots.slice();

    yield YStep('ext', 'l', 'CONSOLIDATE — INICIA A[0..D(n)]',
      `Aloca arranjo auxiliar A[0..${maxDegreeBound(this.n)}] inicializado com NIL`,
      `Objetivo: garantir que no máximo 1 raiz de cada grau permaneça ao final, pagando os links com a queda de potencial ΔΦ.`,
      [this.roots[0].id],
      { formula: this.phiFormulaStr(), delta: `Raízes a consolidar: t(H) = ${rootSnapshotList.length}`, consSlot: null }
    );

    for (const w of rootSnapshotList) {
      let x = w;
      let d = x.deg;
      this.c++;
      yield YStep('ext', 'n', 'CONSOLIDATE — INSPECIONA RAIZ',
        `Visita raiz x = ${fmtKey(x.k)} de grau d = ${d}`,
        this.consA[d]
          ? `Conflito detectado: A[${d}] já guarda a raiz ${fmtKey(this.consA[d].k)} de mesmo grau ${d}!`
          : `A posição A[${d}] está livre (NIL).`,
        [x.id],
        { formula: this.phiFormulaStr(), delta: `Verificando slot A[${d}]`, consSlot: d }
      );

      while (this.consA[d]) {
        let y = this.consA[d];
        this.M.cmp++;
        this.c++;
        if (x.k > y.k) {
          [x, y] = [y, x];
          yield YStep('ext', 'q', 'CONSOLIDATE — TROCA x ↔ y',
            `Como ${fmtKey(y.k)} > ${fmtKey(x.k)}, raiz menor (${fmtKey(x.k)}) será o pai`,
            `Preserva a propriedade de heap mínimo antes de unir as duas árvores de grau ${d}.`,
            [x.id, y.id],
            { formula: this.phiFormulaStr(), delta: `Pai escolhido: ${fmtKey(x.k)}  |  Filho: ${fmtKey(y.k)}`, consSlot: d }
          );
        }

        const phiBeforeLink = this.phi();
        this.roots = this.roots.filter(r => r !== y);
        const yWasMarked = y.mk;
        y.p = x;
        y.mk = false;
        x.ch.push(y);
        x.deg++;
        this.M.lnk++;
        this.c++;
        this.consA[d] = null;
        const oldD = d;
        d++;
        if (d >= this.consA.length) this.consA.push(null);

        yield YStep('ext', 'r', 'FIB-HEAP-LINK',
          `Une árvores de grau ${oldD}: ${fmtKey(y.k)} vira filho de ${fmtKey(x.k)} (novo grau ${d})`,
          `t(H) cai em 1${yWasMarked ? ' e limpa marca' : ''}, reduzindo Φ de ${phiBeforeLink} para ${this.phi()} — o potencial acumulado paga este link!`,
          [x.id, y.id],
          { formula: this.phiFormulaStr(), delta: `LINK #${this.M.lnk}  |  Φ: ${phiBeforeLink} → ${this.phi()}  |  A[${oldD}] ← NIL`, consSlot: d }
        );
      }

      this.consA[d] = x;
      yield YStep('ext', 't', 'CONSOLIDATE — REGISTRA A[d]',
        `Registra raiz ${fmtKey(x.k)} em A[${d}]`,
        `Nenhuma outra árvore processada até agora possui grau ${d}.`,
        [x.id],
        { formula: this.phiFormulaStr(), delta: `A[${d}] ← raiz ${fmtKey(x.k)}`, consSlot: d }
      );
    }

    this.roots = this.consA.filter(Boolean);
    this.min = null;
    for (const r of this.roots) {
      this.c++;
      this.M.cmp++;
      if (!this.min || r.k < this.min.k) this.min = r;
    }
    this.consA = null;

    yield YStep('ext', 'x', 'CONSOLIDATE — CONCLUÍDO',
      `Lista de raízes reconstruída (${this.roots.length} árvore(s)); novo H.min = ${fmtKey(this.min.k)}`,
      `Todas as raízes têm graus distintos ≤ D(n) = ${maxDegreeBound(this.n)}. Variação total na extração: Φ foi de ${pStart} para ${this.phi()}.`,
      [this.min.id],
      { formula: this.phiFormulaStr(), delta: `Novo H.min = ${fmtKey(this.min.k)}  |  Φ: ${pStart} → ${this.phi()} (ΔΦ = ${fmtSigned(this.phi() - pStart)})` }
    );
  }

  *fdec(id, k) {
    const x = this.byId[id];
    if (!x) {
      yield YStep('dec', 'b', 'DECREASE-KEY — AUSENTE', 'Nó inexistente neste heap', 'O identificador não consta em H.');
      return;
    }
    if (k > x.k) {
      yield YStep('dec', 'b', 'ERRO CLRS', `Nova chave (${fmtKey(k)}) > chave atual (${fmtKey(x.k)})`, 'FIB-HEAP-DECREASE-KEY exige k ≤ x.chave.', [id]);
      return;
    }

    const pStart = this.phi();
    const oldK = x.k;
    const y = x.p;
    x.k = k;
    this.c++;

    yield YStep('dec', 'c', 'DECREASE-KEY — REDUZ CHAVE',
      `Atualiza x.chave: ${fmtKey(oldK)} → ${fmtKey(k)} ${y ? `(pai y = ${fmtKey(y.k)})` : '(x já é raiz)'}`,
      y
        ? `Verifica agora se ${fmtKey(k)} < y.chave (${fmtKey(y.k)}), o que violaria a ordem de heap mínimo.`
        : `Como x já pertence à lista de raízes, não há pai a violar; basta comparar com H.min.`,
      y ? [x.id, y.id] : [x.id],
      { formula: this.phiFormulaStr(), delta: `x.chave: ${fmtKey(oldK)} → ${fmtKey(k)}` }
    );

    if (y) {
      this.M.cmp++;
      this.c++;
      if (x.k < y.k) {
        yield* this.cut(x, y);
        yield* this.cascadingCut(y);
      } else {
        yield YStep('dec', 'd', 'ORDEM PRESERVADA',
          `${fmtKey(x.k)} ≥ pai ${fmtKey(y.k)}: nenhum corte necessário`,
          `A propriedade de heap mínimo permanece válida sem alterar a topologia da árvore.`,
          [x.id, y.id],
          { formula: this.phiFormulaStr(), delta: `Sem corte  |  ΔΦ = 0` }
        );
      }
    }

    this.M.cmp++;
    this.c++;
    if (x.k < this.min.k) {
      const prevMin = this.min.k;
      this.min = x;
      yield YStep('dec', 'g', 'ATUALIZA H.min',
        `${fmtKey(x.k)} < ${fmtKey(prevMin)} → x torna-se o novo H.min`,
        `Operação DECREASE-KEY concluída em O(1) amortizado.`,
        [x.id],
        { formula: this.phiFormulaStr(), delta: `H.min ← ${fmtKey(x.k)}  |  ΔΦ total = ${fmtSigned(this.phi() - pStart)}` }
      );
    } else {
      yield YStep('dec', 'g', 'MANTÉM H.min',
        `H.min permanece ${fmtKey(this.min.k)}`,
        `Operação DECREASE-KEY concluída em O(1) amortizado.`,
        [this.min.id],
        { formula: this.phiFormulaStr(), delta: `H.min = ${fmtKey(this.min.k)}  |  ΔΦ total = ${fmtSigned(this.phi() - pStart)}` }
      );
    }
  }

  *cut(x, y) {
    const phiBefore = this.phi();
    y.ch = y.ch.filter(c => c !== x);
    y.deg--;
    this.roots.push(x);
    x.p = null;
    x.mk = false;
    this.M.cut++;
    this.c++;
    yield YStep('dec', 'j', 'CUT(H, x, y)',
      `Corta ${fmtKey(x.k)} do pai ${fmtKey(y.k)} (grau de y cai para ${y.deg}) e move para raízes`,
      `x entra na lista circular de raízes com marca ← FALSE.`,
      [x.id, y.id],
      { formula: this.phiFormulaStr(), delta: `CUT #${this.M.cut}  |  Φ: ${phiBefore} → ${this.phi()}` }
    );
  }

  *cascadingCut(y) {
    const z = y.p;
    if (!z) {
      yield YStep('dec', 'l', 'CASCADING-CUT — ATINGIU RAIZ',
        `Pai ${fmtKey(y.k)} é raiz (y.p = NIL): cortes em cascata encerram`,
        `Raízes nunca são marcadas no Heap de Fibonacci.`,
        [y.id],
        { formula: this.phiFormulaStr(), delta: `y.p = NIL (fim da cascata)` }
      );
      return;
    }
    if (!y.mk) {
      const phiBefore = this.phi();
      y.mk = true;
      yield YStep('dec', 'n', 'CASCADING-CUT — MARCA NÓ INTERNO',
        `Nó interno ${fmtKey(y.k)} perdeu seu 1º filho → recebe marca = TRUE`,
        `A marca adiciona +2 unidades ao potencial Φ(H), reservando crédito exato para pagar um eventual corte futuro de ${fmtKey(y.k)}!`,
        [y.id],
        { formula: this.phiFormulaStr(), delta: `${fmtKey(y.k)}.marca: FALSE → TRUE  |  Φ: ${phiBefore} → ${this.phi()} (+2)` }
      );
    } else {
      this.M.cas++;
      yield YStep('dec', 'o', 'CASCADING-CUT — PROPAGA CORTE!',
        `Nó ${fmtKey(y.k)} já estava marcado (perdeu o 2º filho) → corta de ${fmtKey(z.k)}!`,
        `Ao cortar ${fmtKey(y.k)} e limpar sua marca, m(H) cai em 1 (−2 em Φ) e t(H) sobe em 1 (+1 em Φ): ΔΦ = −1 paga o corte em cascata!`,
        [y.id, z.id],
        { formula: this.phiFormulaStr(), delta: `Cascata #${this.M.cas} acionada em ${fmtKey(y.k)}` }
      );
      yield* this.cut(y, z);
      yield* this.cascadingCut(z);
    }
  }
}

for (const opName of ['ins', 'mn', 'ext', 'dec', 'uni']) {
  HeapModel.prototype[opName] = function*(...args) {
    yield* this[(this.t === 'f' ? 'f' : 'd') + opName](...args);
  };
}

/* ==========================================================================
   4. ESTADO GLOBAL DO SIMULADOR & HISTÓRICO NAVEGÁVEL (⏮ ◀ ▶ ⏭ ⏯)
   ========================================================================== */
const MODE_NAMES = ['Binário (d = 2)', '4-ário (d = 4)', '8-ário (d = 8)', 'Fibonacci (Cap. 19)', 'Comparar os 4'];
const createFourSet = () => [
  new HeapModel('d', 2, 'Heap Binário (d = 2)'),
  new HeapModel('d', 4, 'Heap 4-ário (d = 4)'),
  new HeapModel('d', 8, 'Heap 8-ário (d = 8)'),
  new HeapModel('f', 0, 'Heap de Fibonacci')
];

const SETS = {
  single: createFourSet(),
  compare: createFourSet()
};

let currentMode = 3; // 3 = Fibonacci (padrão)
let focusedCompareIdx = 3; // Em modo comparar, foca inicialmente no Fibonacci
let nextNodeId = 1;
let selectedNodeId = null;
let currentZoom = 1;

let flatSteps = [];
let currentStepIdx = -1;
let playTimer = null;
let balloonHiddenManually = false;
let inspectedNodeOverride = null; // Permite clicar em qualquer nó a qualquer momento

function getActiveLiveHeaps() {
  return currentMode < 4 ? [SETS.single[currentMode]] : SETS.compare;
}

function getFocusedHeapIndex() {
  return currentMode < 4 ? 0 : Math.min(focusedCompareIdx, 3);
}

// Executa uma operação nos heaps ativos e grava cada passo como snapshot completo
function runAndRecordOperation(opLabel, pseudoKey, generatorFactory, silentSteps = false) {
  stopAutoPlay();
  inspectedNodeOverride = null;
  const heaps = getActiveLiveHeaps();
  const runners = heaps.map(h => {
    const pExtra = h._unionPhiExtra || 0;
    h._unionPhiExtra = 0;
    return {
      h,
      c0: h.c,
      p0: h.phi() + pExtra,
      gen: generatorFactory(h),
      done: false,
      lastStepInfo: null
    };
  });

  if (runners.every(r => !r.gen)) {
    setBannerMessage('Operação não pôde ser iniciada: verifique o nó selecionado.', true);
    return;
  }

  const startIdx = flatSteps.length;

  if (silentSteps) {
    // Executa até o fim e grava apenas o passo resumo final da operação
    runners.forEach(r => {
      if (!r.gen) return;
      for (const s of r.gen) r.lastStepInfo = s;
      r.h.recordOpSummary(opLabel, r.c0, r.p0);
    });
    flatSteps.push({
      opTitle: opLabel,
      pseudoKey,
      heapsSnap: runners.map(r => r.h.snapshot(r.lastStepInfo, r.c0, r.p0))
    });
    currentStepIdx = flatSteps.length - 1;
    renderAll();
    return;
  }

  let safety = 0;
  while (safety++ < 4000) {
    let anyActive = false;
    for (const r of runners) {
      if (!r.gen || r.done) continue;
      const res = r.gen.next();
      if (res.done) {
        r.done = true;
        r.h.recordOpSummary(opLabel, r.c0, r.p0);
      } else {
        r.lastStepInfo = res.value;
        anyActive = true;
      }
    }
    if (!anyActive) break;

    flatSteps.push({
      opTitle: opLabel,
      pseudoKey,
      heapsSnap: runners.map(r => r.h.snapshot(r.lastStepInfo, r.c0, r.p0))
    });
  }

  // Garante que o último frame da operação já reflita o acumulado consolidado
  if (flatSteps.length > startIdx) {
    runners.forEach(r => {
      if (r.gen && !r.done) r.h.recordOpSummary(opLabel, r.c0, r.p0);
    });
    flatSteps[flatSteps.length - 1].heapsSnap = runners.map(r => r.h.snapshot(r.lastStepInfo, r.c0, r.p0));
    $('#ps-select').value = pseudoKey;
    startAutoPlayFrom(startIdx);
  } else {
    renderAll();
  }
}

/* ==========================================================================
   5. LAYOUT HIERÁRQUICO CANÔNICO + RENDERIZAÇÃO DE NÓS E CURVAS BEZIER SVG
   ========================================================================== */
const FIB_BOX_W = 112;
const FIB_BOX_H = 44;
const DARY_BOX_W = 86;
const DARY_BOX_H = 42;
const LEVEL_GAP_Y = 54;
const SIBLING_GAP_X = 14;
const TREE_ROOT_GAP_X = 22;

function measureSubtree(node, isFib) {
  const selfW = isFib ? FIB_BOX_W : DARY_BOX_W;
  const selfH = isFib ? FIB_BOX_H : DARY_BOX_H;
  node.boxW = selfW;
  node.boxH = selfH;
  if (!node.kids || !node.kids.length) {
    node.subtreeW = selfW;
    return selfW;
  }
  let childrenW = 0;
  node.kids.forEach((ch, idx) => {
    childrenW += measureSubtree(ch, isFib);
    if (idx > 0) childrenW += SIBLING_GAP_X;
  });
  node.subtreeW = Math.max(selfW, childrenW);
  return node.subtreeW;
}

function positionSubtree(node, leftX, topY) {
  node.x = leftX + (node.subtreeW - node.boxW) / 2;
  node.y = topY;
  if (node.kids && node.kids.length) {
    const totalKidsW = node.kids.reduce((acc, c) => acc + c.subtreeW, 0) + SIBLING_GAP_X * (node.kids.length - 1);
    let curX = leftX + (node.subtreeW - totalKidsW) / 2;
    const nextY = topY + node.boxH + LEVEL_GAP_Y;
    for (const ch of node.kids) {
      positionSubtree(ch, curX, nextY);
      curX += ch.subtreeW + SIBLING_GAP_X;
    }
  }
}

function maxBottomY(node) {
  let m = node.y + node.boxH;
  if (node.kids) {
    for (const c of node.kids) m = Math.max(m, maxBottomY(c));
  }
  return m;
}

function buildHeapDiagramMarkup(heapSnap, panelIdx = 0) {
  const isFib = heapSnap.t === 'f';
  const hlIds = new Set(heapSnap.step && heapSnap.step.hl ? heapSnap.step.hl : []);

  const groups = [{ label: heapSnap.auxTrees ? 'H1' : '', trees: heapSnap.trees.map(t => JSON.parse(JSON.stringify(t))) }];
  if (heapSnap.auxTrees && heapSnap.auxTrees.length) {
    groups.push({ label: 'H2 (a unir)', trees: heapSnap.auxTrees.map(t => JSON.parse(JSON.stringify(t))) });
  }

  const totalRootsCount = groups.reduce((s, g) => s + g.trees.length, 0);
  if (totalRootsCount === 0) {
    return {
      empty: true,
      width: 520,
      height: 150,
      svgHTML: '',
      nodesHTML: `<div class="empty-heap-placeholder">Estrutura vazia (n = 0, min = NIL${isFib ? ', Φ = 0' : ''}). Insira chaves ou carregue um Preset acima.</div>`
    };
  }

  let cursorX = 24;
  const topStartY = heapSnap.auxTrees ? 42 : 28;
  let maxBottom = topStartY + 60;

  groups.forEach((grp, gIdx) => {
    grp.startX = cursorX;
    grp.trees.forEach((rootNode, rIdx) => {
      measureSubtree(rootNode, isFib);
      positionSubtree(rootNode, cursorX, topStartY);
      maxBottom = Math.max(maxBottom, maxBottomY(rootNode));
      cursorX += rootNode.subtreeW + (rIdx < grp.trees.length - 1 ? TREE_ROOT_GAP_X : 0);
    });
    grp.endX = cursorX;
    if (gIdx < groups.length - 1) cursorX += 44;
  });

  const totalWidth = Math.max(cursorX + 24, 520);
  const totalHeight = maxBottom + 26;

  // Coleta mapa de nós para achar ancestrais do nó ativo
  const byIdMap = new Map();
  const collectMap = n => {
    byIdMap.set(n.id, n);
    if (n.kids) n.kids.forEach(collectMap);
  };
  groups.forEach(g => g.trees.forEach(collectMap));

  const ancestorIds = new Set();
  hlIds.forEach(hid => {
    let cur = byIdMap.get(hid);
    while (cur && cur.parentId) {
      ancestorIds.add(cur.parentId);
      cur = byIdMap.get(cur.parentId);
    }
  });

  let edgesHTML = '';
  let nodesHTML = '';

  groups.forEach(grp => {
    if (grp.label) {
      edgesHTML += `<text x="${grp.startX}" y="18" class="group-banner-svg">${esc(grp.label)}</text>`;
    }
    // Linha tracejada da lista circular duplamente encadeada de raízes (Fibonacci)
    if (isFib && grp.trees.length > 1) {
      const firstR = grp.trees[0];
      const lastR = grp.trees[grp.trees.length - 1];
      const yMid = firstR.y + firstR.boxH / 2;
      edgesHTML += `<line class="svg-edge edge-rootlist" x1="${(firstR.x + firstR.boxW / 2).toFixed(1)}" y1="${yMid.toFixed(1)}" x2="${(lastR.x + lastR.boxW / 2).toFixed(1)}" y2="${yMid.toFixed(1)}" />`;
    }

    const walk = node => {
      const isActive = inspectedNodeOverride
        ? (inspectedNodeOverride.nodeId === node.id && inspectedNodeOverride.panelIdx === panelIdx)
        : hlIds.has(node.id);
      const isSelected = selectedNodeId === node.id;
      const isAncestor = ancestorIds.has(node.id);

      const classes = [
        'heap-node',
        isFib ? 'fib-node' : 'dary-node',
        node.isMin ? 'node-is-min' : '',
        isFib && node.mk ? 'node-marked' : '',
        isAncestor ? 'node-ancestor' : '',
        isSelected ? 'node-selected' : '',
        isActive ? 'node-active' : ''
      ].filter(Boolean).join(' ');

      let roleText = '';
      if (isFib) {
        if (node.isMin) roleText = 'H.min · Raiz';
        else if (node.isRoot) roleText = 'Raiz';
        else if (node.mk) roleText = 'Marcado ★';
        else roleText = `Filho (g=${node.deg})`;
      } else {
        roleText = node.idx === 0 ? 'Raiz A[0] (min)' : `A[${node.idx}]`;
      }

      if (isFib) {
        nodesHTML += `<div class="${classes}" data-node-id="${node.id}" data-panel-idx="${panelIdx}" style="left:${Math.round(node.x)}px;top:${Math.round(node.y)}px;width:${node.boxW}px;height:${node.boxH}px">
          <div class="node-role-tag">${esc(roleText)}</div>
          <div class="node-top-row">
            <div class="node-attr-cell"><span class="attr-lbl">chave</span><span class="attr-val val-key">${esc(fmtKey(node.k))}</span></div>
            <div class="node-attr-cell"><span class="attr-lbl">grau</span><span class="attr-val">${node.deg}</span></div>
            <div class="node-attr-cell"><span class="attr-lbl">marca</span><span class="attr-val ${node.mk ? 'val-mark-true' : 'val-mark-false'}">${node.mk ? 'TRUE' : 'FALSE'}</span></div>
          </div>
        </div>`;
      } else {
        nodesHTML += `<div class="${classes}" data-node-id="${node.id}" data-panel-idx="${panelIdx}" style="left:${Math.round(node.x)}px;top:${Math.round(node.y)}px;width:${node.boxW}px;height:${node.boxH}px">
          <div class="node-role-tag">${esc(roleText)}</div>
          <div class="node-top-row">
            <div class="node-attr-cell"><span class="attr-lbl">índice</span><span class="attr-val">${node.idx}</span></div>
            <div class="node-attr-cell"><span class="attr-lbl">chave</span><span class="attr-val val-key">${esc(fmtKey(node.k))}</span></div>
          </div>
        </div>`;
      }

      if (node.kids && node.kids.length) {
        node.kids.forEach((ch, idx) => {
          const span = Math.min(node.boxW - 16, node.kids.length * 14);
          const offset = node.kids.length === 1 ? 0 : -span / 2 + (span * idx) / (node.kids.length - 1);
          const startX = node.x + node.boxW / 2 + offset;
          const startY = node.y + node.boxH;
          const endX = ch.x + ch.boxW / 2;
          const endY = ch.y;
          const midY = (startY + endY) / 2;
          const edgeActive = (hlIds.has(node.id) && hlIds.has(ch.id)) || hlIds.has(ch.id) || ancestorIds.has(ch.id);
          edgesHTML += `<path class="svg-edge ${edgeActive ? 'edge-active' : ''}" d="M ${startX.toFixed(1)} ${startY.toFixed(1)} C ${startX.toFixed(1)} ${midY.toFixed(1)}, ${endX.toFixed(1)} ${midY.toFixed(1)}, ${endX.toFixed(1)} ${endY.toFixed(1)}" />`;
          walk(ch);
        });
      }
    };

    grp.trees.forEach(walk);
  });

  return { empty: false, width: totalWidth, height: totalHeight, svgHTML: edgesHTML, nodesHTML };
}

/* ==========================================================================
   6. ZOOM, FAIXAS AUXILIARES, BALÃO FLUTUANTE E RENDERIZAÇÃO COMPLETA
   ========================================================================== */
let lastUnscaledW = 680;
let lastUnscaledH = 300;

function applyCanvasZoom(scale) {
  currentZoom = Math.max(0.28, Math.min(1.5, scale));
  $('#zoom-lbl').textContent = `${Math.round(currentZoom * 100)}%`;
  if (currentMode < 4) {
    const canvas = $('#tree-canvas');
    const wrapper = $('#tree-scale-wrapper');
    canvas.style.transform = `scale(${currentZoom})`;
    wrapper.style.width = `${Math.ceil(lastUnscaledW * currentZoom)}px`;
    wrapper.style.height = `${Math.ceil(lastUnscaledH * currentZoom)}px`;
  } else {
    document.querySelectorAll('.compare-inner-canvas').forEach(el => {
      const w = Number(el.dataset.w) || 520;
      const h = Number(el.dataset.h) || 200;
      el.style.transform = `scale(${currentZoom})`;
      el.parentElement.style.width = `${Math.ceil(w * currentZoom)}px`;
      el.parentElement.style.height = `${Math.ceil(h * currentZoom)}px`;
    });
  }
  requestAnimationFrame(positionFloatingBalloon);
}

function fitTreeToViewport() {
  const vp = $('#tree-viewport');
  const availW = vp.clientWidth - 44;
  if (availW <= 0) return;
  if (currentMode < 4) {
    const ideal = Math.min(1, availW / Math.max(1, lastUnscaledW));
    applyCanvasZoom(ideal);
  } else {
    const cardW = (availW - 20) / 2 - 28;
    let maxW = 520;
    document.querySelectorAll('.compare-inner-canvas').forEach(el => {
      maxW = Math.max(maxW, Number(el.dataset.w) || 520);
    });
    const ideal = Math.min(1, Math.max(0.45, cardW / maxW));
    applyCanvasZoom(ideal);
  }
}

function getActiveStepBundle() {
  if (currentStepIdx >= 0 && currentStepIdx < flatSteps.length) {
    return flatSteps[currentStepIdx];
  }
  // Sem passos: tira snapshot ao vivo dos heaps atuais
  return {
    opTitle: 'Estado Atual',
    pseudoKey: $('#ps-select').value,
